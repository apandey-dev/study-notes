<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Day Theme Background: Morning Sky and Soft Sun Glow -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/> <!-- Sky Blue -->
      <stop offset="50%" stop-color="#60A5FA"/> <!-- Vibrant Blue -->
      <stop offset="100%" stop-color="#3B82F6"/> <!-- Deep Royal Blue -->
    </linearGradient>

    <!-- Warm Daylight Sun Glow -->
    <radialGradient id="sunGlow" cx="15%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="1"/>
      <stop offset="40%" stop-color="#FDE047" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>

    <!-- Premium Bright Ivory Notebook Page -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFDF5"/> <!-- Soft Ivory -->
    </linearGradient>

    <!-- Crimson Leather Bookmark Ribbon -->
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <!-- Day Theme Pen Body (Warm Walnut Wood) -->
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Professional Soft Dropshadows -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1E3A8A" flood-opacity="0.2"/>
    </filter>
    
    <filter id="pageShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas (Sky Blue Day Gradient) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#logoBg)" filter="url(#shadow)"/>

  <!-- Morning Sun Radial Overlay -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#sunGlow)"/>

  <!-- Subtle Day Border Frame -->
  <rect x="34" y="34" width="444" height="444" rx="98" stroke="rgba(255, 255, 255, 0.4)" stroke-width="4" fill="none"/>

  <!-- Left Open Book Page (Ivory paper) -->
  <path d="M 120 128 C 120 128, 200 120, 250 136 L 250 380 C 200 364, 120 372, 120 372 Z" 
        fill="url(#pageGrad)" filter="url(#pageShadow)"/>

  <!-- Right Open Book Page (Ivory paper) -->
  <path d="M 392 128 C 392 128, 312 120, 262 136 L 262 380 C 312 364, 392 372, 392 372 Z" 
        fill="url(#pageGrad)" filter="url(#pageShadow)"/>

  <!-- Notebook Spine Shadow -->
  <path d="M 250 136 L 262 136 L 262 380 L 250 380 Z" fill="#E2E8F0"/>

  <!-- Ruled Notebook Lines (Left Page) -->
  <line x1="150" y1="180" x2="230" y2="180" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
  <line x1="150" y1="216" x2="230" y2="216" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="150" y1="252" x2="230" y2="252" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="150" y1="288" x2="230" y2="288" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="150" y1="324" x2="210" y2="324" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Ruled Notebook Lines (Right Page) -->
  <line x1="282" y1="180" x2="362" y2="180" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
  <line x1="282" y1="216" x2="362" y2="216" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="282" y1="252" x2="362" y2="252" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="282" y1="288" x2="362" y2="288" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="282" y1="324" x2="340" y2="324" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Red Leather Bookmark Ribbon -->
  <path d="M 330 120 L 358 120 L 358 220 L 344 206 L 330 220 Z" fill="url(#bookmarkGrad)" filter="url(#pageShadow)"/>

  <!-- Floating Fountain Pen / Nib -->
  <g transform="translate(290, 240) rotate(-35)">
    <path d="M 0 0 L 18 -45 L 36 0 L 26 120 L 10 120 Z" fill="url(#penGrad)" filter="url(#shadow)"/>
    <polygon points="18,-45 8,0 28,0" fill="#FEF3C7"/>
    <circle cx="18" cy="-15" r="4" fill="#78350F"/>
    <line x1="18" y1="-45" x2="18" y2="-15" stroke="#78350F" stroke-width="2"/>
  </g>

  <!-- Sparkle Sunbeams / Star Accents -->
  <path d="M 170 140 L 174 152 L 186 156 L 174 160 L 170 172 L 166 160 L 154 156 L 166 152 Z" fill="#FBBF24"/>
  <path d="M 380 90 L 382 96 L 388 98 L 382 100 L 380 106 L 378 100 L 372 98 L 378 96 Z" fill="#FFF" opacity="0.9"/>
</svg>
