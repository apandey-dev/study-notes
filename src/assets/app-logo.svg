<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Main App Icon Background Gradient -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Notebook Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Bookmark Ribbon Gradient -->
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Pen Accent Gold Gradient -->
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
    
    <filter id="pageShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas Container -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#logoBg)" filter="url(#shadow)"/>

  <!-- Subtle Inner Glow Border -->
  <rect x="34" y="34" width="444" height="444" rx="98" stroke="rgba(255, 255, 255, 0.25)" stroke-width="4" fill="none"/>

  <!-- Left Open Book Page -->
  <path d="M 120 128 C 120 128, 200 120, 250 136 L 250 380 C 200 364, 120 372, 120 372 Z" 
        fill="url(#pageGrad)" filter="url(#pageShadow)"/>

  <!-- Right Open Book Page -->
  <path d="M 392 128 C 392 128, 312 120, 262 136 L 262 380 C 312 364, 392 372, 392 372 Z" 
        fill="url(#pageGrad)" filter="url(#pageShadow)"/>

  <!-- Notebook Spine Shadow -->
  <path d="M 250 136 L 262 136 L 262 380 L 250 380 Z" fill="#CBD5E1"/>

  <!-- Ruled Notebook Lines (Left Page) -->
  <line x1="150" y1="180" x2="230" y2="180" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <line x1="150" y1="216" x2="230" y2="216" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="252" x2="230" y2="252" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="288" x2="230" y2="288" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="324" x2="210" y2="324" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

  <!-- Ruled Notebook Lines (Right Page) -->
  <line x1="282" y1="180" x2="362" y2="180" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <line x1="282" y1="216" x2="362" y2="216" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <line x1="282" y1="252" x2="362" y2="252" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <line x1="282" y1="288" x2="362" y2="288" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <line x1="282" y1="324" x2="340" y2="324" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

  <!-- Emerald Bookmark Ribbon -->
  <path d="M 330 120 L 358 120 L 358 220 L 344 206 L 330 220 Z" fill="url(#bookmarkGrad)" filter="url(#pageShadow)"/>

  <!-- Floating Fountain Pen / Nib -->
  <g transform="translate(290, 240) rotate(-35)">
    <path d="M 0 0 L 18 -45 L 36 0 L 26 120 L 10 120 Z" fill="url(#penGrad)" filter="url(#shadow)"/>
    <polygon points="18,-45 8,0 28,0" fill="#FEF3C7"/>
    <circle cx="18" cy="-15" r="4" fill="#78350F"/>
    <line x1="18" y1="-45" x2="18" y2="-15" stroke="#78350F" stroke-width="2"/>
  </g>

  <!-- Sparkle Star Accent -->
  <path d="M 170 140 L 174 152 L 186 156 L 174 160 L 170 172 L 166 160 L 154 156 L 166 152 Z" fill="#FBBF24"/>
</svg>
